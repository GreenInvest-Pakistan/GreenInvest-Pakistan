name: Product problem
description: Report reproducible behaviour without sharing personal data.
title: "[Problem]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach bills, addresses, account numbers, owner tokens, private quotations, saved plans, or identifying screenshots. Use synthetic values.
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Hosted calculator
        - Windows application
        - Public documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or date
      placeholder: "For example: Windows 4.3.0 or hosted service on 24 August 2026"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using synthetic values
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal, financial, account, address, token, and private quotation information.
          required: true
